<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f1e8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EJ Gestión">
<title>EJ Inspiration | Gestión V25.16</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f1e8;--card:#fffdf9;--ink:#34291f;--brown:#563827;--muted:#8b7b6c;--line:#e6d9c8;--cream:#eadfce;--bad:#f2d2d0;--warn:#f5e5ad;--ok:#dcebd7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 15px 40px #3a26151a}
.logo{font:700 30px Georgia,serif;margin-bottom:5px}.sub{color:var(--muted);margin-bottom:24px}label{font-size:12px;font-weight:700;color:var(--muted)}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:white;margin:6px 0 14px}
.btn{border:0;background:var(--brown);color:white;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.btn.alt{background:var(--cream);color:var(--brown)}.btn.full{width:100%}
.app{display:none;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#fbf7f0;border-right:1px solid var(--line);padding:24px 15px}nav button{width:100%;border:0;background:none;text-align:left;padding:12px;border-radius:9px;color:#6e6054;font-weight:700;cursor:pointer}nav button:hover,nav button.active{background:var(--cream);color:var(--brown)}
main{padding:26px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:10px}h1,h2{font-family:Georgia,serif;margin:0}.who{font-size:13px;color:var(--muted)}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 3px 10px #5d43220a}.panel{margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.metric{font-size:25px;font-weight:800;margin-top:8px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;color:var(--muted);text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.badge{padding:5px 8px;border-radius:999px;background:var(--ok);font-size:11px;font-weight:700}.badge.low{background:var(--warn)}.badge.out{background:var(--bad)}.msg{font-size:13px;margin-top:12px;color:#8a4038}
@media(max-width:800px){html,body{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}.login{padding:14px;min-height:100dvh}.loginbox{padding:22px 18px}.app{display:none;grid-template-columns:minmax(0,1fr);width:100%}aside{position:fixed;top:0;left:-290px;z-index:60;width:280px;height:100dvh;padding:76px 14px 20px;border-right:1px solid var(--line);border-bottom:0;background:#fbf7f0;box-shadow:8px 0 24px #3a261526;transition:left .25s ease;overflow-y:auto}aside.mobile-open{left:0}aside>div:first-child{display:none}nav{display:block;overflow:visible}nav button{display:block;width:100%;min-width:0;padding:13px 12px;font-size:14px;white-space:normal;background:transparent;border:0;margin-bottom:3px}.mobile-menu-btn{display:flex!important;align-items:center;justify-content:center;position:fixed;top:12px;left:12px;z-index:80;width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--brown);font-size:25px;box-shadow:0 3px 12px #3a26151a}.menu-overlay{display:none;position:fixed;inset:0;z-index:50;background:#0005}.menu-overlay.show{display:block}main{min-width:0;width:100%;padding:72px 12px 28px}.top{align-items:flex-start;margin-bottom:14px}.top h1{font-size:24px}.who{font-size:11px;max-width:145px}.panel,.card{padding:14px;max-width:100%;overflow:hidden}.head{align-items:flex-start;flex-wrap:wrap}.cards{grid-template-columns:1fr 1fr;gap:9px}.metric{font-size:21px}.grid{grid-template-columns:1fr;gap:8px}input,select,textarea{font-size:16px!important;max-width:100%}.btn{min-height:42px}table{min-width:680px;font-size:12px}.panel:has(table),.card:has(table){overflow-x:auto;-webkit-overflow-scrolling:touch}#content{min-width:0;max-width:100%}}@media(max-width:430px){.cards{grid-template-columns:1fr}.panel,.card{padding:12px}main{padding-left:10px;padding-right:10px}}
.mobile-menu-btn,.menu-overlay{display:none}
.product-thumb{width:54px;height:54px;object-fit:cover;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}.photo-empty{width:54px;height:54px;border-radius:9px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:10px;text-align:center;background:#fff}.photo-preview{max-width:120px;max-height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin:4px 0 12px}.photo-modal{position:fixed;inset:0;background:#000a;z-index:120;display:flex;align-items:center;justify-content:center;padding:24px}.photo-modal img{max-width:min(900px,95vw);max-height:88vh;border-radius:14px;background:white}.photo-modal button{position:absolute;top:18px;right:18px;border:0;border-radius:999px;width:42px;height:42px;font-size:22px;cursor:pointer}

/* V25.10 · Inventario ajustado a escritorio + ficha rápida */
.inventory-table-wrap{width:100%;max-width:100%;overflow:visible}
#inventoryTable{width:100%;table-layout:fixed;font-size:14px}
#inventoryTable th,#inventoryTable td{padding:12px 9px;vertical-align:middle;word-break:normal}
#inventoryTable th{font-size:10px;line-height:1.15}
#inventoryTable .product-thumb,#inventoryTable .photo-empty{width:58px;height:58px;margin:auto}
#inventoryTable th:nth-child(1){width:7%}#inventoryTable th:nth-child(2){width:9%}#inventoryTable th:nth-child(3){width:14%}#inventoryTable th:nth-child(4){width:28%}#inventoryTable th:nth-child(5){width:9%}#inventoryTable th:nth-child(6){width:10%}#inventoryTable th:nth-child(7){width:9%}#inventoryTable th:nth-child(8){width:8%}#inventoryTable th:nth-child(9){width:10%}
#inventoryTable td:nth-child(4){overflow-wrap:anywhere}.product-link{border:0;background:none;padding:0;color:var(--brown);font-weight:700;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}.product-link:hover{opacity:.72}
.product-detail-modal{position:fixed;inset:0;background:#0008;z-index:130;display:flex;align-items:center;justify-content:center;padding:22px}.product-detail-card{position:relative;width:min(760px,96vw);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 60px #0003}.product-detail-close{position:absolute;right:14px;top:14px;border:0;border-radius:999px;width:40px;height:40px;background:var(--cream);color:var(--brown);font-size:22px;cursor:pointer}.product-detail-top{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:start}.product-detail-photo{width:190px;height:190px;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:white}.product-detail-empty{width:190px;height:190px;border:1px dashed var(--line);border-radius:14px;display:grid;place-items:center;color:var(--muted);background:white}.product-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:18px}.product-detail-item{border-top:1px solid var(--line);padding-top:9px}.product-detail-item small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:700;margin-bottom:4px}
@media(max-width:1100px) and (min-width:801px){main{padding:20px 14px}.app{grid-template-columns:195px minmax(0,1fr)}#inventoryTable{font-size:13px}#inventoryTable th,#inventoryTable td{padding:10px 6px}#inventoryTable .product-thumb,#inventoryTable .photo-empty{width:52px;height:52px}}
@media(max-width:800px){.inventory-table-wrap{overflow:visible!important}#inventoryTable{display:block;min-width:0!important;width:100%;font-size:13px}#inventoryTable thead{display:none}#inventoryTable tbody{display:grid;grid-template-columns:1fr;gap:12px}#inventoryTable tr{display:grid!important;grid-template-columns:76px minmax(0,1fr) minmax(0,1fr);gap:8px 10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fffdf9;box-shadow:0 2px 8px #5d43220a}#inventoryTable td{display:block;border:0;padding:0;min-width:0;font-size:13px;overflow-wrap:anywhere}#inventoryTable td::before{content:attr(data-label);display:block;font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:3px}#inventoryTable td:nth-child(1){grid-row:1 / span 2;grid-column:1;align-self:start}#inventoryTable td:nth-child(1)::before{display:none}#inventoryTable td:nth-child(1) .product-thumb,#inventoryTable td:nth-child(1) .photo-empty{width:72px!important;height:72px!important}#inventoryTable td:nth-child(4){grid-column:2 / 4;font-size:15px}#inventoryTable td:nth-child(9){grid-column:1 / 4;display:flex;gap:8px;margin-top:4px}#inventoryTable td:nth-child(9)::before{display:none}#inventoryTable td:nth-child(9) .btn{width:50%;min-height:40px;font-size:13px}.product-detail-top{grid-template-columns:1fr}.product-detail-photo,.product-detail-empty{width:100%;height:min(62vw,260px)}.product-detail-grid{grid-template-columns:1fr 1fr}.product-detail-card{padding:18px}.product-detail-card h2{padding-right:42px}}
@media(max-width:430px){.product-detail-grid{grid-template-columns:1fr}}

/* V25.10 · ajuste final de ancho de Inventario en escritorio */
@media (min-width:801px){
  .inventory-table-wrap{width:100%;max-width:100%;overflow-x:hidden;box-sizing:border-box}
  #inventoryTable{width:100%!important;max-width:100%;table-layout:fixed!important;border-collapse:collapse;box-sizing:border-box}
  #inventoryTable th,#inventoryTable td{box-sizing:border-box;padding:12px 7px;overflow:hidden}
  #inventoryTable th:nth-child(1){width:6%!important}
  #inventoryTable th:nth-child(2){width:8%!important}
  #inventoryTable th:nth-child(3){width:11%!important}
  #inventoryTable th:nth-child(4){width:29%!important}
  #inventoryTable th:nth-child(5){width:8%!important}
  #inventoryTable th:nth-child(6){width:9%!important}
  #inventoryTable th:nth-child(7){width:9%!important}
  #inventoryTable th:nth-child(8){width:9%!important}
  #inventoryTable th:nth-child(9){width:11%!important}
  #inventoryTable td:nth-child(2),#inventoryTable td:nth-child(3){overflow-wrap:break-word}
  #inventoryTable td:nth-child(4){white-space:normal;overflow-wrap:break-word}
  #inventoryTable td:nth-child(5),#inventoryTable td:nth-child(6),#inventoryTable td:nth-child(7){white-space:nowrap;text-align:center}
  #inventoryTable td:nth-child(8){text-align:center;overflow:visible}
  #inventoryTable td:nth-child(9){white-space:normal!important;overflow:visible}
  #inventoryTable td:nth-child(9) .btn{display:block;width:100%;max-width:100%;margin:4px 0!important;padding:9px 5px!important;font-size:12px!important;box-sizing:border-box}
  #inventoryTable .product-thumb,#inventoryTable .photo-empty{width:54px;height:54px;max-width:100%}
}

</style></head>

const SUPABASE_URL='https://ntualkoalqsnumewzkmx.supabase.co';
const SUPABASE_KEY='sb_publishable_hLqxBJokRpIJt5XoRO6Dzg_QkL5oTOP';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentProfile=null;
const modules=["Inicio","Clientes","Proveedores","Catálogo de productos","Inventario","Pedidos","Cotizaciones","Cobros","Compras y Gastos","Ajustes","Calculadora de precios","Reportes"];

function money(n){return "$"+Number(n||0).toFixed(2)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
const EJ_CATEGORIES=["Digital","Topper","Candy Bar","Sublimación","Grabado láser","Textil","Papelería","Religiosos","Cajas de regalo","Corporativos","Decoración","Stickers"];
function normalizeText(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function searchTable(inputId,tableId){const q=normalizeText(document.getElementById(inputId)?.value);document.querySelectorAll(`#${tableId} tbody tr`).forEach(r=>r.style.display=!q||normalizeText((r.dataset.search||'')+' '+r.innerText).includes(q)?'':'none')}
function searchBox(id,tableId,placeholder='Buscar por nombre, código, teléfono o fecha...'){return `<div style="margin:12px 0"><input id="${id}" oninput="searchTable('${id}','${tableId}')" placeholder="🔎 ${placeholder}" style="max-width:520px"></div>`}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function deliveryAlert(date,status){if(!date||['Entregado','Cancelado'].includes(status))return '';const a=new Date(todayISO()+'T00:00:00'),b=new Date(date+'T00:00:00'),days=Math.round((b-a)/86400000);if(days<0)return '<span class="badge out">🔴 Atrasado</span>';if(days===0)return '<span class="badge out">🔴 Entrega hoy</span>';if(days===1)return '<span class="badge low">⚠ Entrega mañana</span>';return ''}
function categoryOptions(current=''){const vals=[...new Set([...EJ_CATEGORIES,...((window._catalogCategories||[]).filter(Boolean))])];return vals.map(v=>`<option value="${esc(v)}" ${normalizeText(v)===normalizeText(current)?'selected':''}>${esc(v)}</option>`).join('')}
function setupNav(){nav.innerHTML=modules.map(m=>`<button onclick="show('${m}');closeMobileMenu()">${m}</button>`).join("")}
function toggleMobileMenu(){document.querySelector('aside').classList.toggle('mobile-open');menuOverlay.classList.toggle('show')}
function closeMobileMenu(){document.querySelector('aside').classList.remove('mobile-open');menuOverlay.classList.remove('show')}
async function signIn(){
 loginMsg.textContent="Ingresando...";
 const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
 if(error){loginMsg.textContent="No se pudo iniciar sesión. Revisa correo y contraseña.";return}
 await enterApp(data.user);
}
async function enterApp(user){
 currentUser=user;
 const {data,error}=await sb.from("profiles").select("nombre,rol,activo").eq("id",user.id).single();
 if(error||!data||!data.activo){await sb.auth.signOut();loginMsg.textContent="Este usuario no tiene un perfil activo de EJ Inspiration.";return}
 currentProfile=data;login.style.display="none";app.style.display="grid";who.textContent=`${data.nombre} · ${data.rol}`;setupNav();show("Inicio");
}
async function signOut(){await sb.auth.signOut();currentUser=null;currentProfile=null;app.style.display="none";login.style.display="grid";password.value="";loginMsg.textContent=""}
async function show(m){
 title.textContent=m;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.textContent===m));

function invUniqueSuggestions(values){
 const grouped=new Map();
 for(const raw of (values||[])){
   const v=String(raw??'').trim(); if(!v)continue;
   const key=normalizeText(v).replace(/\s+/g,' ').trim();

}

function adjustmentTypeChanged(){

function adjustmentCalc(){

async function resolveOrderClient(){
 const nombre=oname.value.trim(),cedula=oruc.value.trim(),telefono=ophone.value.trim(),instagram=oig.value.trim();
 if(!nombre)throw new Error("Escribe el nombre del cliente.");
 let clients=window._clients||[];
 let c=clients.find(x=>oclient.value&&x.id===oclient.value) || clients.find(x=>cedula&&x.cedula_ruc&&normClient(x.cedula_ruc)===normClient(cedula)) || clients.find(x=>telefono&&x.telefono&&normClient(x.telefono)===normClient(telefono)) || clients.find(x=>normClient(x.nombre)===normClient(nombre));
 if(!c){
   const {data,error}=await sb.from("clientes").insert({nombre,cedula_ruc:cedula||null,telefono:telefono||null,instagram:instagram||null,activo:true,created_by:currentUser.id}).select("id,nombre,cedula_ruc,telefono,instagram").single();
   if(error)throw error;c=data;window._clients.push(c);
 }else{
   const patch={};if(nombre&&nombre!==c.nombre)patch.nombre=nombre;if(cedula&&!c.cedula_ruc)patch.cedula_ruc=cedula;if(telefono&&!c.telefono)patch.telefono=telefono;if(instagram&&!c.instagram)patch.instagram=instagram;
   if(Object.keys(patch).length){const {data,error}=await sb.from("clientes").update(patch).eq("id",c.id).select("id,nombre,cedula_ruc,telefono,instagram").single();if(error)throw error;c=data;}
 }
 oclient.value=c.id;return c.id;
}

 if(!isManual&&!c)return alert("Selecciona un producto o servicio.");
 if(q<=0)return alert("La cantidad debe ser mayor que cero.");
 if(!Number.isFinite(pr)||pr<=0)return alert("Indica un precio de venta mayor que $0.00.");
 if(isManual){
   const name=(document.getElementById("omanualName")?.value||"").trim();
   if(!name)return alert("Escribe el nombre del producto manual.");

async function saveManualCatalogItems(lines){
 const pending=lines.filter(x=>x.guardar_catalogo&&!x.catalogo_producto_id);
 for(const x of pending){
   const existing=(window._catalog||window._qcatalog||[]).find(p=>normClient(p.nombre)===normClient(x.descripcion));
   if(existing){x.catalogo_producto_id=existing.id;continue;}
   const pool=[...(window._catalog||[]),...(window._qcatalog||[])];
   const max=Math.max(0,...pool.map(p=>/^\d+$/.test(String(p.codigo||""))?Number(p.codigo):0));
   const codigo=String(max+1).padStart(4,"0");
   const payload={codigo,categoria:"Otros",nombre:x.descripcion,descripcion:null,tipo:"Producto",precio_venta:Number(x.precio_unitario||0),controla_inventario:false,producto_inventario_id:null,activo:true,created_by:currentUser.id,updated_by:currentUser.id,updated_at:new Date().toISOString()};
   const {data,error}=await sb.from("catalogo_productos").insert(payload).select("id,codigo,nombre,precio_venta,controla_inventario,producto_inventario_id").single();
   if(error)throw error;x.catalogo_producto_id=data.id;
   if(window._catalog)window._catalog.push(data);if(window._qcatalog)window._qcatalog.push(data);
 }
}

 await orders();

async function saveManualCatalogFromEdit(name,price){

 if(existing)return existing.id;
 const code='MAN-'+Date.now().toString().slice(-6);
 const payload={codigo:code,categoria:'MANUAL',nombre:name.trim(),descripcion:'Agregado desde edición de pedido',tipo:'Producto',precio_venta:Number(price||0),controla_inventario:false,activo:true,created_by:currentUser.id};
 const {data,error}=await sb.from('catalogo_productos').insert(payload).select('id').single();

async function saveOrderLines(id){
 const rows=[...document.querySelectorAll("#editLines .v12line")];
 if(!rows.length)return alert("El pedido debe tener al menos un producto o servicio.");
 let lines=[];
 try{
  for(const r of rows){
   let catalogo_producto_id=r.querySelector(".lcatalog").value;
   const cantidad=Number(r.querySelector(".lqty").value||0), precio_unitario=Number(r.querySelector(".lprice").value||0);
   const personalizacion=r.querySelector(".lpersonal").value||null;
   let descripcion='';
   if(cantidad<=0)return alert("La cantidad debe ser mayor que cero.");
   if(precio_unitario<=0)return alert("El precio debe ser mayor que cero.");
   if(catalogo_producto_id==='__manual__'){
     descripcion=(r.querySelector('.lmanualname').value||'').trim();
     if(!descripcion)return alert('Escribe el nombre del producto manual.');
     if(r.querySelector('.lmanualsave').checked)catalogo_producto_id=await saveManualCatalogFromEdit(descripcion,precio_unitario);
     else catalogo_producto_id=null;
   }else{
     if(!catalogo_producto_id)return alert("Selecciona un producto o usa + Agregar producto manual.");
     descripcion=(window._catalog||[]).find(c=>c.id===catalogo_producto_id)?.nombre||'';
   }
   lines.push({catalogo_producto_id,descripcion,cantidad,precio_unitario,personalizacion});
  }
 }catch(e){return alert('No se pudo agregar al catálogo: '+e.message)}
 if(!confirm("¿Guardar los cambios de productos de este pedido?"))return;
 const {data,error}=await sb.rpc("editar_pedido_lineas",{p_pedido_id:id,p_lineas:lines});
 if(error)return alert("No se pudo editar: "+error.message);
 alert(`Pedido actualizado. Nuevo total: ${money(data.total)} · Saldo: ${money(data.saldo)}`);
 await orders();
}

function normClient(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().replace(/\s+/g," ").toLowerCase()}
function qFillClient(){
 let c=(window._qclients||[]).find(x=>normClient(x.nombre)===normClient(qname.value));
 qclient.value=c?.id||"";
 if(c){qruc.value=c.cedula_ruc||"";qphone.value=c.telefono||"";qig.value=c.instagram||""}
}
async function resolveQuoteClient(){
 const nombre=qname.value.trim(), cedula=qruc.value.trim(), telefono=qphone.value.trim(), instagram=qig.value.trim();
 if(!nombre)throw new Error("Escribe el nombre del cliente.");
 let clients=window._qclients||[];
 let c=clients.find(x=>qclient.value&&x.id===qclient.value) || clients.find(x=>cedula&&x.cedula_ruc&&normClient(x.cedula_ruc)===normClient(cedula)) || clients.find(x=>telefono&&x.telefono&&normClient(x.telefono)===normClient(telefono)) || clients.find(x=>normClient(x.nombre)===normClient(nombre));
 if(!c){
   const {data,error}=await sb.from("clientes").insert({nombre,cedula_ruc:cedula||null,telefono:telefono||null,instagram:instagram||null,activo:true,created_by:currentUser.id}).select("id,nombre,cedula_ruc,telefono,instagram").single();
   if(error)throw error; c=data;
 }else{
   const patch={}; if(nombre&&nombre!==c.nombre)patch.nombre=nombre; if(cedula&&!c.cedula_ruc)patch.cedula_ruc=cedula; if(telefono&&!c.telefono)patch.telefono=telefono; if(instagram&&!c.instagram)patch.instagram=instagram;
   if(Object.keys(patch).length){const {data,error}=await sb.from("clientes").update(patch).eq("id",c.id).select("id,nombre,cedula_ruc,telefono,instagram").single();if(error)throw error;c=data}
 }
 qclient.value=c.id; return c.id;
}
function qFillPrice(){const manual=qprod.value==="__manual__";document.getElementById("qmanualBox")?.classList.toggle("hidden",!manual);if(manual){qprice.value="";document.getElementById("qmanualName")?.focus();return;}let p=(window._qcatalog||[]).find(x=>x.id===qprod.value);if(p)qprice.value=Number(p.precio_venta||0).toFixed(2)}
function qAddLine(){
 const isManual=qprod.value==="__manual__";let p=(window._qcatalog||[]).find(x=>x.id===qprod.value),qty=Number(qqty.value||0),price=Number(qprice.value||0);
 if(!isManual&&!p)return alert("Selecciona un producto o servicio.");if(qty<=0||price<=0)return alert("Cantidad y precio deben ser mayores que cero.");
 if(isManual){const name=(document.getElementById("qmanualName")?.value||"").trim();if(!name)return alert("Escribe el nombre del producto manual.");quoteLines.push({catalogo_producto_id:null,producto_id:null,descripcion:name,color:null,talla:null,personalizacion:qpers.value.trim()||null,cantidad:qty,precio_unitario:price,descuento:0,guardar_catalogo:!!document.getElementById("qmanualSave")?.checked});}
 else quoteLines.push({catalogo_producto_id:p.id,producto_id:p.controla_inventario?p.producto_inventario_id:null,descripcion:p.nombre,color:p.productos?.color||null,talla:p.productos?.talla||null,personalizacion:qpers.value.trim()||null,cantidad:qty,precio_unitario:price,descuento:0});
 qprod.value="";qqty.value=1;qprice.value="";qpers.value="";if(document.getElementById("qmanualName"))qmanualName.value="";if(document.getElementById("qmanualSave"))qmanualSave.checked=false;document.getElementById("qmanualBox")?.classList.add("hidden");qRenderLines();
}
function qRenderLines(){

}

async function payments(){
 const {data,error}=await sb.from("pedidos").select("id,numero,fecha,total,telefono,clientes(nombre,telefono),cobros(monto,fecha,metodo_pago,referencia)").order("created_at",{ascending:false});

function renderPayments(period='all'){
 const data=window._paymentOrders||[], today=todayISO(), now=new Date(), month=today.slice(0,7); const monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7));const weekStart=monday.toISOString().slice(0,10);
 const inPeriod=d=>period==='all'||(period==='today'&&d===today)||(period==='week'&&d>=weekStart&&d<=today)||(period==='month'&&String(d||'').startsWith(month));
 let total=0,collected=0,receivable=0,methods={'Efectivo':0,'Yappy':0,'Tarjeta':0,'Transferencia/ACH':0};
 let rows=data.map(o=>{let allPaid=(o.cobros||[]).reduce((s,c)=>s+Number(c.monto),0),bal=Math.max(Number(o.total)-allPaid,0);total+=Number(o.total);receivable+=bal;(o.cobros||[]).filter(c=>inPeriod(c.fecha)).forEach(c=>{collected+=Number(c.monto);let k=c.metodo_pago||'Otro';if(methods[k]===undefined)methods[k]=0;methods[k]+=Number(c.monto)});return `<tr data-search="${esc([o.numero,o.fecha,o.clientes?.nombre,o.telefono,o.clientes?.telefono].join(' '))}"><td>${esc(o.numero)}</td><td>${esc(o.clientes?.nombre||'—')}</td><td>${money(o.total)}</td><td>${money(allPaid)}</td><td>${money(bal)}</td></tr>`}).join('');
 content.innerHTML=`<div class="panel"><div class="head"><h2>Cobros</h2><select onchange="renderPayments(this.value)" style="max-width:220px"><option value="all" ${period==='all'?'selected':''}>Todos los cobros</option><option value="today" ${period==='today'?'selected':''}>Hoy</option><option value="week" ${period==='week'?'selected':''}>Esta semana</option><option value="month" ${period==='month'?'selected':''}>Este mes</option></select></div></div>
 <div class="cards"><div class="card">Cobrado ${period==='all'?'':'en el período'}<div class="metric">${money(collected)}</div></div><div class="card">Efectivo<div class="metric">${money(methods['Efectivo'])}</div></div><div class="card">Yappy<div class="metric">${money(methods['Yappy'])}</div></div><div class="card">Tarjeta<div class="metric">${money(methods['Tarjeta'])}</div></div><div class="card">Transferencia/ACH<div class="metric">${money(methods['Transferencia/ACH'])}</div></div><div class="card">Por cobrar<div class="metric">${money(receivable)}</div></div></div>
 <div class="panel"><h2>Cobros y saldos</h2>${searchBox('paymentSearch','paymentTable','Buscar por pedido, cliente, celular o fecha...')}<div style="overflow:auto"><table id="paymentTable"><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Cobrado</th><th>Saldo</th></tr></thead><tbody>${rows}</tbody></table></div><p style="color:var(--muted);font-size:13px">Los montos por método muestran únicamente el dinero efectivamente registrado en cada cobro.</p></div>`;
}

 window._cgRecords=records||[];
 content.innerHTML=`<div class="cards">

async function priceCalculator(useForQuote=false){
 const target = useForQuote && document.getElementById("qprice") ? document.getElementById("qprice") : null;
 content.innerHTML=`<div class="panel"><h2>Calculadora de costos y precios</h2><p style="color:var(--muted)">Cargando inventario...</p></div>`;
 const {data:pcInventory,error:pcInvError}=await sb.from('productos').select('id,codigo,categoria,producto,color,talla,medida,existencia,costo_unitario').eq('activo',true).order('producto');
 window._pcInventory=pcInventory||[];
 window._pcItems=[{source:'inventory',product_id:'',name:'',qty:1,cost:0}];
 window._pcMode='detail';
 const render=()=>{
  content.innerHTML=`<div class="panel"><div class="head"><div><h2>Calculadora de costos y precios</h2><p style="color:var(--muted);margin:5px 0 0">Calcula el costo TOTAL del trabajo y luego el costo real por unidad.</p></div>${target?'<button class="btn alt" id="pcBack">Volver a cotización</button>':''}</div>
  ${pcInvError?`<div style="padding:10px;border:1px solid #d7b8a6;border-radius:10px;margin-bottom:12px">No se pudo cargar el inventario: ${esc(pcInvError.message)}</div>`:''}
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><button class="btn ${window._pcMode==='quick'?'':'alt'}" id="pcQuick">Cálculo rápido</button><button class="btn ${window._pcMode==='detail'?'':'alt'}" id="pcDetail">Cálculo detallado</button></div>
  <div id="pcBody"></div></div>`;
  pcQuick.onclick=()=>{window._pcMode='quick';render()};pcDetail.onclick=()=>{window._pcMode='detail';render()};
  if(target&&document.getElementById('pcBack'))pcBack.onclick=()=>quotationForm();
  window._pcMode==='quick'?renderQuick():renderDetail();
 };
 const results=(totalCost,qty,markup,desired=0)=>{
   qty=Math.max(1,Math.floor(qty||1)); markup=Math.max(0,markup||0);
   const unitCost=totalCost/qty;
   const suggested=unitCost*(1+markup/100);
   const price=desired>0?desired:suggested;
   const unitProfit=price-unitCost;
   const totalSales=price*qty;
   const totalProfit=totalSales-totalCost;
   const real=unitCost>0?unitProfit/unitCost*100:0;
   return {totalCost,qty,unitCost,suggested,price,unitProfit,totalSales,totalProfit,real};
 };

 const bindUse=r=>{window._pcPrice=r.price;document.getElementById('pcUse').onclick=()=>{if(target){target.value=r.price.toFixed(2);alert('Precio unitario aplicado a la cotización.');}else alert('Precio unitario definido: '+money(r.price));};};
 const renderQuick=()=>{

  const calc=()=>{let cost=['q1','q2','q3','q4'].reduce((a,id)=>a+Math.max(0,+document.getElementById(id).value||0),0);let r=results(cost,+qq.value,+qm.value,+qp.value);pcRes.innerHTML=resultHTML(r);bindUse(r)};
  ['q1','q2','q3','q4','qq','qm','qp'].forEach(id=>document.getElementById(id).oninput=calc);calc();
 };
 const renderDetail=()=>{
  pcBody.innerHTML=`<div class="grid"><div><label>Nombre del trabajo / producto</label><input id="pcName" placeholder="Ej. Imanes para nevera"></div><div><label>Cantidad a producir</label><input id="pcQty" type="number" min="1" step="1" value="1"></div></div>
  <h3 style="margin:18px 0 8px">1. Materiales y componentes</h3><p style="color:var(--muted);margin-top:0;font-size:13px"><b>Estos sí se calculan por cantidad.</b> Elige un artículo del inventario para traer automáticamente su costo real, o agrégalo manualmente si todavía no está registrado.</p><div id="pcItems"></div><button class="btn alt" id="pcAdd">+ Agregar material</button>
  <h3 style="margin:20px 0 8px">2. Trabajo y procesos</h3><p style="color:var(--muted);margin-top:0;font-size:13px">Escribe aquí el costo del proceso para TODO el trabajo, no por cada unidad.</p><div class="grid"><div><label>Diseño</label><input class="pcProc" id="prDesign" type="number" min="0" step="0.01" value="0"></div><div><label>Impresión / tinta</label><input class="pcProc" id="prPrint" type="number" min="0" step="0.01" value="0"></div><div><label>Corte / recorte</label><input class="pcProc" id="prCut" type="number" min="0" step="0.01" value="0"></div><div><label>Grabado / sublimación / DTF</label><input class="pcProc" id="prCustom" type="number" min="0" step="0.01" value="0"></div><div><label>Armado / empaque</label><input class="pcProc" id="prAssembly" type="number" min="0" step="0.01" value="0"></div><div><label>Otro proceso</label><input class="pcProc" id="prOther" type="number" min="0" step="0.01" value="0"></div></div>

  const invOpts=()=>`<option value="">Seleccionar del inventario</option>${(window._pcInventory||[]).map(p=>`<option value="${p.id}">${esc(p.codigo||'')} · ${esc(p.producto)}${p.color?' · '+esc(p.color):''}${p.talla?' · '+esc(p.talla):''}${p.medida?' · '+esc(p.medida):''} · ${money(p.costo_unitario||0)}</option>`).join('')}`;
  const drawItems=()=>{pcItems.innerHTML=window._pcItems.map((x,i)=>`<div style="padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff"><div class="grid" style="align-items:end"><div><label>Origen</label><select class="pciSource" data-i="${i}"><option value="inventory" ${x.source==='inventory'?'selected':''}>Inventario</option><option value="manual" ${x.source==='manual'?'selected':''}>Material manual</option></select></div>${x.source==='inventory'?`<div><label>Artículo del inventario</label><select class="pciProduct" data-i="${i}">${invOpts()}</select></div>`:`<div><label>Material / componente</label><input class="pciName" data-i="${i}" value="${esc(x.name)}" placeholder="Ej. Imán, papel, bolsa"></div>`}<div><label>Cantidad usada</label><input class="pciQty" data-i="${i}" type="number" min="0" step="0.01" value="${x.qty}"></div><div><label>Costo unitario</label><input class="pciCost" data-i="${i}" type="number" min="0" step="0.01" value="${x.cost}" ${x.source==='inventory'?'readonly':''}></div></div><div style="margin-top:8px;text-align:right"><button class="btn alt pciDel" data-i="${i}" ${window._pcItems.length===1?'disabled':''}>Quitar</button></div></div>`).join('');
    document.querySelectorAll('.pciSource').forEach(e=>e.onchange=()=>{let x=window._pcItems[+e.dataset.i];x.source=e.value;x.product_id='';x.name='';x.cost=0;drawItems();calc()});
    document.querySelectorAll('.pciProduct').forEach(e=>{let x=window._pcItems[+e.dataset.i];e.value=x.product_id||'';e.onchange=()=>{let p=(window._pcInventory||[]).find(z=>z.id===e.value);x.product_id=e.value;x.name=p?.producto||'';x.cost=Number(p?.costo_unitario||0);drawItems();calc()}});
    document.querySelectorAll('.pciName').forEach(e=>e.oninput=()=>window._pcItems[+e.dataset.i].name=e.value);
    document.querySelectorAll('.pciQty').forEach(e=>e.oninput=()=>{window._pcItems[+e.dataset.i].qty=Math.max(0,+e.value||0);calc()});

    document.querySelectorAll('.pciDel').forEach(e=>e.onclick=()=>{window._pcItems.splice(+e.dataset.i,1);drawItems();calc()});
  };
  const calc=()=>{const materials=window._pcItems.reduce((a,x)=>a+(+x.qty||0)*(+x.cost||0),0);const proc=[...document.querySelectorAll('.pcProc')].reduce((a,e)=>a+(+e.value||0),0);const base=[...document.querySelectorAll('.pcBase')].reduce((a,e)=>a+(+e.value||0),0);const before=materials+proc+base;const waste=before*Math.max(0,+pcWaste.value||0)/100;const totalCost=before+waste;const r=results(totalCost,+pcQty.value,+pcMargin.value,+pcDesired.value);pcRes.innerHTML=`<div style="margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#faf6ef"><b>Resumen del costo TOTAL</b><div style="margin-top:7px;font-size:14px">Materiales ${money(materials)} · Procesos ${money(proc)} · Básicos ${money(base)} · Merma ${money(waste)}</div><div style="margin-top:6px;font-size:13px;color:var(--muted)">Procesos y costos básicos se suman una sola vez al trabajo completo.</div></div>${resultHTML(r)}<div style="margin-top:10px"><button class="btn alt" id="pcSaveCatalog">Guardar como producto del catálogo</button></div>`;bindUse(r);document.getElementById('pcSaveCatalog').onclick=async()=>{let name=pcName.value.trim();if(!name)return alert('Escribe el nombre del producto.');let code=('CAL-'+Date.now().toString().slice(-6));let desc='Costo total del trabajo '+money(totalCost)+' · Cantidad '+r.qty+' · Costo unitario '+money(r.unitCost)+' · Materiales: '+window._pcItems.filter(x=>x.name).map(x=>x.name).join(', ');let {error}=await sb.from('catalogo_productos').insert({codigo:code,categoria:'CALCULADOS',nombre:name,descripcion:desc,tipo:'Producto',precio_venta:r.price,controla_inventario:false,activo:true,created_by:currentUser.id});if(error)return alert('No se pudo guardar: '+error.message);alert('Producto guardado en el catálogo con precio unitario '+money(r.price));};};
  pcAdd.onclick=()=>{window._pcItems.push({source:'inventory',product_id:'',name:'',qty:1,cost:0});drawItems();calc()};drawItems();document.querySelectorAll('.pcProc,.pcBase').forEach(e=>e.oninput=calc);['pcQty','pcWaste','pcMargin','pcDesired'].forEach(id=>document.getElementById(id).oninput=calc);calc();
 };
 render();
}

 let sales=orders.reduce((s,x)=>s+Number(x.total||0),0),collected=collections.reduce((s,x)=>s+Number(x.monto||0),0),cogs=details.reduce((s,x)=>s+Number(x.cantidad||0)*Number(x.costo_historico||0),0);
 let invPurch=expenses.filter(x=>x.destino==='Mercancía para inventario').reduce((s,x)=>s+Number(x.total||0),0),direct=expenses.filter(x=>x.destino==='Compra directa para pedido').reduce((s,x)=>s+Number(x.total||0),0),oper=expenses.filter(x=>x.destino==='Gasto operativo').reduce((s,x)=>s+Number(x.total||0),0);
 let orderIds=orders.map(x=>x.id), allPay=orderIds.length?(await sb.from('cobros').select('pedido_id,monto').in('pedido_id',orderIds)).data||[]:[];let paidBy={};allPay.forEach(x=>paidBy[x.pedido_id]=(paidBy[x.pedido_id]||0)+Number(x.monto||0));let receivable=orders.reduce((s,x)=>s+Math.max(0,Number(x.total||0)-(paidBy[x.id]||0)),0);
 let gross=sales-cogs-direct,profit=gross-oper,invValue=products.reduce((s,x)=>s+Number(x.existencia||0)*Number(x.costo_unitario||0),0),low=products.filter(x=>Number(x.existencia||0)<=Number(x.stock_minimo||0));
